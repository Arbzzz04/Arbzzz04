<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Arbaaz Ali Jaffer, Data Engineer and Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#11243f"/>
      <stop offset="1" stop-color="#1c3d66"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#93c5fd" opacity="0.12"/>
    </pattern>
    <linearGradient id="fadeRight" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0b1220" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background, dot grid, and a fade so the text side stays calm -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="260" rx="18" fill="url(#fadeRight)"/>

  <!-- pipeline: three sources feed a transform step, which feeds a warehouse -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path id="p1" d="M 760 70 C 830 70, 830 130, 900 130" stroke="#38bdf8" opacity="0.55"/>
    <path id="p2" d="M 760 130 L 900 130" stroke="#38bdf8" opacity="0.55"/>
    <path id="p3" d="M 760 190 C 830 190, 830 130, 900 130" stroke="#38bdf8" opacity="0.55"/>
    <path id="p4" d="M 960 130 L 1080 130" stroke="#f59e0b" opacity="0.7"/>
  </g>

  <!-- data moving along the pipes -->
  <g>
    <circle r="4" fill="#7dd3fc"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4" fill="#7dd3fc"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4" fill="#7dd3fc"><animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#fbbf24"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <!-- source nodes -->
  <g fill="#0f2a47" stroke="#38bdf8" stroke-width="2">
    <rect x="712" y="52" width="48" height="36" rx="8"/>
    <rect x="712" y="112" width="48" height="36" rx="8"/>
    <rect x="712" y="172" width="48" height="36" rx="8"/>
  </g>
  <g fill="#7dd3fc" opacity="0.8">
    <rect x="722" y="63" width="28" height="3" rx="1.5"/><rect x="722" y="69" width="20" height="3" rx="1.5"/><rect x="722" y="75" width="24" height="3" rx="1.5"/>
    <rect x="722" y="123" width="28" height="3" rx="1.5"/><rect x="722" y="129" width="18" height="3" rx="1.5"/><rect x="722" y="135" width="24" height="3" rx="1.5"/>
    <rect x="722" y="183" width="28" height="3" rx="1.5"/><rect x="722" y="189" width="22" height="3" rx="1.5"/><rect x="722" y="195" width="16" height="3" rx="1.5"/>
  </g>

  <!-- transform step -->
  <circle cx="930" cy="130" r="30" fill="#0f2a47" stroke="#38bdf8" stroke-width="2.5"/>
  <g stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round">
    <path d="M 917 122 L 943 122"/><path d="M 921 130 L 939 130"/><path d="M 925 138 L 935 138"/>
  </g>

  <!-- warehouse (cylinder) -->
  <g stroke="#f59e0b" stroke-width="2.5" fill="#2a2210">
    <path d="M 1084 108 L 1084 152 A 26 9 0 0 0 1136 152 L 1136 108"/>
    <ellipse cx="1110" cy="108" rx="26" ry="9"/>
  </g>
  <path d="M 1084 130 A 26 9 0 0 0 1136 130" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>

  <!-- text -->
  <text x="64" y="118" fill="#f8fafc" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="0.5">Arbaaz Ali Jaffer</text>
  <text x="66" y="160" fill="#93c5fd" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500">Data Engineer · Software Developer</text>
  <rect x="66" y="182" width="56" height="4" rx="2" fill="#f59e0b"/>
  <text x="66" y="214" fill="#94a3b8" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17">SQL · Python · Apache Spark</text>
</svg>
